# nfpm config: build the Linux .deb and .rpm for a release.
# Docs: https://nfpm.goreleaser.com
#
# libusb is compiled in statically (rusb "vendored"), so there is no libusb
# runtime dependency; the vendored libusb still links libudev dynamically.
name: ptouch
arch: ${PACKAGE_ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Huang Rui <vowstar@gmail.com>
description: |
  Tools for Brother P-Touch label printers.
  Command-line (ptouch) and GUI (ptouch-gui) for composing and printing labels.
vendor: vowstar
homepage: https://github.com/vowstar/ptouch-rs
license: GPL-3.0-or-later

contents:
  - src: ./target/${RUST_TARGET}/${BUILD_PROFILE}/ptouch
    dst: /usr/bin/ptouch
    expand: true
  - src: ./target/${RUST_TARGET}/${BUILD_PROFILE}/ptouch-gui
    dst: /usr/bin/ptouch-gui
    expand: true
  - src: ./data/io.github.vowstar.ptouch-gui.desktop
    dst: /usr/share/applications/io.github.vowstar.ptouch-gui.desktop
  - src: ./data/io.github.vowstar.ptouch-gui.svg
    dst: /usr/share/icons/hicolor/scalable/apps/io.github.vowstar.ptouch-gui.svg
  - src: ./data/udev/20-usb-ptouch-permissions.rules
    dst: /usr/lib/udev/rules.d/20-usb-ptouch-permissions.rules

scripts:
  postinstall: ./packaging/postinstall.sh

# Include libraries the GUI opens dynamically as well as libusb's libudev dependency.
overrides:
  deb:
    depends:
      - libudev1
      - libegl1
      - libgl1
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxinerama1
      - libxrandr2
      - libxrender1
      - libxcb1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libwayland-egl1
      - libdbus-1-3
    recommends:
      - fonts-dejavu-core
  rpm:
    depends:
      - systemd-libs
      - libglvnd-egl
      - libglvnd-glx
      - libX11
      - libX11-xcb
      - libXcursor
      - libXi
      - libXinerama
      - libXrandr
      - libXrender
      - libxcb
      - libxkbcommon
      - libxkbcommon-x11
      - wayland-libs
      - dbus-libs
    recommends:
      - dejavu-sans-fonts
